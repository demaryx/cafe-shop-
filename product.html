<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | Kyesthensia Cafe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="section">
      <div class="container product-detail-wrap">
        <a href="index.html#products" class="btn">Back to Products</a>
        <div class="product-detail-card">
          <img id="detailImage" src="images/product-1.jpg" alt="Product image" />
          <div class="product-detail-content">
            <h1 id="detailTitle">Product Name</h1>
            <p id="detailPrice" class="detail-price">$0</p>
            <p id="detailDescription">
              Product description will appear here.
            </p>
            <ul class="detail-points" id="detailPoints"></ul>
            <button id="orderNowBtn" class="btn btn-full" style="margin-top: 25px;">Order Now</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Order Modal -->
    <div class="popup-modal" id="orderModal">
      <div class="popup-content order-popup">
        <button class="close-popup" id="closeOrderPopup" aria-label="Close Order">&times;</button>
        <div class="popup-header">
          <h2>Place Your Order</h2>
          <p>Complete the form below to order <span id="selectedProduct" style="color: var(--accent); font-weight: 700;">this item</span></p>
        </div>
        <form id="orderForm" class="order-form">
          <div class="form-group">
            <label for="orderName">Full Name</label>
            <input type="text" id="orderName" required placeholder="Your Name" />
          </div>
          <div class="form-group">
            <label for="orderPhone">Phone Number</label>
            <input type="tel" id="orderPhone" required placeholder="0300-1234567" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="orderSize">Size</label>
              <select id="orderSize">
                <option value="regular">Regular</option>
                <option value="large">Large (+ $5)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="orderQuantity">Quantity</label>
              <input type="number" id="orderQuantity" value="1" min="1" required />
            </div>
          </div>
          <div class="form-group">
            <label for="orderExtras">Customize (Milk / Sugar / Toppings)</label>
            <select id="orderExtras">
              <option value="none">Standard</option>
              <option value="extra-sugar">Extra Sugar</option>
              <option value="almond-milk">Almond Milk</option>
              <option value="extra-cream">Extra Cream</option>
            </select>
          </div>
          <div class="form-group">
            <label for="orderAddress">Delivery Address</label>
            <textarea id="orderAddress" rows="2" required placeholder="Enter your full address"></textarea>
          </div>
          <button type="submit" class="btn btn-full">Confirm Order</button>
        </form>
      </div>
    </div>

    <script>
      const products = {
        "product-1": {
          title: "Whole Grain Bread",
          price: "$40",
          image: "images/burger.jpg",
          description:
            "Freshly baked whole grain bread with balanced texture and rich taste.",
          points: ["High-fiber flour", "Perfect for breakfast", "Freshly baked daily"],
        },
        "product-2": {
          title: "Fresh Fruit Tart",
          price: "$40",
          image: "images/icecream.jpg",
          description:
            "Light and creamy fruit tart made with seasonal toppings and crisp crust.",
          points: ["Premium cream", "Seasonal fruits", "Best served chilled"],
        },
        "product-3": {
          title: "French Baguette",
          price: "$40",
          image: "images/pasta.jpg",
          description:
            "Classic French baguette with crispy crust and soft interior.",
          points: ["Stone-baked texture", "Authentic recipe", "Great with soups"],
        },
        "product-4": {
          title: "Almond Cake",
          price: "$40",
          image: "images/muffin2.jpg",
          description:
            "Soft almond cake with buttery notes and a premium bakery finish.",
          points: ["Roasted almond flavor", "Light sweetness", "Handcrafted garnish"],
        },
        "product-5": {
          title: "Honey Pie",
          price: "$40",
          image: "images/cookies.jpg",
          description:
            "Golden honey pie made with smooth layers and aromatic filling.",
          points: ["Natural honey touch", "Layered pastry", "Cafe signature item"],
        },
        "product-6": {
          title: "Mini Bun",
          price: "$40",
          image: "images/donts.jpg",
          description:
            "Soft mini bun ideal for quick snacks with tea or coffee pairings.",
          points: ["Soft baked dough", "Family favorite", "Fresh every morning"],
        },
      };

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "product-1";
      const product = products[id] || products["product-1"];

      document.getElementById("detailImage").src = product.image;
      document.getElementById("detailImage").alt = product.title;
      document.getElementById("detailTitle").textContent = product.title;
      document.getElementById("detailPrice").textContent = product.price;
      document.getElementById("detailDescription").textContent = product.description;
      document.getElementById("detailPoints").innerHTML = product.points
        .map((point) => "<li>" + point + "</li>")
        .join("");

      // Order Modal Logic
      const orderModal = document.getElementById("orderModal");
      const orderNowBtn = document.getElementById("orderNowBtn");
      const closeOrderPopup = document.getElementById("closeOrderPopup");
      const selectedProductSpan = document.getElementById("selectedProduct");
      const orderForm = document.getElementById("orderForm");

      orderNowBtn.addEventListener("click", () => {
        selectedProductSpan.textContent = product.title;
        orderModal.classList.add("show");
      });

      closeOrderPopup.addEventListener("click", () => {
        orderModal.classList.remove("show");
      });

      orderForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const submitBtn = orderForm.querySelector("button");
        submitBtn.textContent = "Processing...";
        submitBtn.disabled = true;

        setTimeout(() => {
          alert("Order Received! We will contact you shortly to confirm.");
          orderForm.reset();
          submitBtn.textContent = "Confirm Order";
          submitBtn.disabled = false;
          orderModal.classList.remove("show");
        }, 1500);
      });
    </script>
  </body>
</html>
